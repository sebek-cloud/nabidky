<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Orphans – Vyúčtovací nabídky</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ======================= APLIKACE ======================= -->
  <div id="app">
    <header class="topbar">
      <img id="topbar-logo" class="topbar-logo" alt="ORPHANS" />
      <div class="topbar-title">Vyúčtovací nabídka</div>
      <div class="topbar-actions">
        <button id="btn-new" class="btn btn-ghost" type="button">Nová nabídka</button>
        <button id="btn-open" class="btn btn-ghost" type="button">Uložené</button>
        <button id="btn-save" class="btn btn-ghost" type="button">Uložit</button>
        <button id="btn-pdf" class="btn btn-primary" type="button">Stáhnout PDF</button>
        <button id="btn-logout" class="btn btn-ghost" type="button">Odhlásit</button>
      </div>
    </header>

    <main class="sheet">
      <!-- Strany -->
      <section class="parties">
        <!-- Dodavatel -->
        <div class="card">
          <div class="card-head">
            <h2>Dodavatel</h2>
            <button class="link" type="button" data-toggle="supplier">Upravit</button>
          </div>
          <div id="supplier-view" class="party-view"></div>
          <div id="supplier-edit" class="party-edit" hidden>
            <label>Název <input data-sup="nazev" /></label>
            <div class="row2">
              <label>IČO <input data-sup="ico" inputmode="numeric" /></label>
              <label>DIČ <input data-sup="dic" /></label>
            </div>
            <label>Adresa <input data-sup="adresa" /></label>
            <label>Číslo účtu / IBAN <input data-sup="ucet" placeholder="doplňte" /></label>
            <div class="row2">
              <label>E-mail <input data-sup="email" /></label>
              <label>Telefon <input data-sup="telefon" /></label>
            </div>
            <div class="party-edit-actions">
              <button class="btn btn-sm btn-ghost" type="button" id="sup-ares">Načíst z ARES</button>
              <button class="btn btn-sm btn-primary" type="button" id="sup-save">Uložit</button>
            </div>
          </div>
        </div>

        <!-- Odběratel -->
        <div class="card">
          <div class="card-head">
            <h2>Odběratel</h2>
          </div>
          <div class="ares-lookup">
            <input id="cust-ico" placeholder="IČO odběratele" inputmode="numeric" />
            <button class="btn btn-sm btn-primary" type="button" id="cust-ares">Načíst z ARES</button>
          </div>
          <div id="cust-status" class="ares-status" hidden></div>
          <div class="party-edit">
            <label>Název <input data-cust="nazev" placeholder="název firmy" /></label>
            <div class="row2">
              <label>IČO <input data-cust="ico" inputmode="numeric" /></label>
              <label>DIČ <input data-cust="dic" /></label>
            </div>
            <label>Adresa <input data-cust="adresa" placeholder="ulice, město, PSČ" /></label>
          </div>
        </div>
      </section>

      <!-- Metadata nabídky -->
      <section class="meta card">
        <label>Číslo nabídky <input id="m-cislo" /></label>
        <label>Datum vystavení <input id="m-datum" type="date" /></label>
        <label>Platnost do <input id="m-platnost" type="date" /></label>
        <label>Měna
          <select id="m-mena">
            <option value="CZK">CZK</option>
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
          </select>
        </label>
      </section>

      <!-- Předmět / popis nabídky -->
      <section class="card">
        <div class="card-head"><h2>Předmět / popis nabídky</h2></div>
        <textarea id="m-predmet" rows="3" placeholder="Např. na jaký projekt nabídka je, obecný popis…"></textarea>
      </section>

      <!-- Položky -->
      <section class="items card">
        <div class="items-head">
          <span class="col-desc">Popis</span>
          <span class="col-qty">Počet</span>
          <span class="col-unit">MJ</span>
          <span class="col-qty">Koef.</span>
          <span class="col-unit">MJ</span>
          <span class="col-price">Cena / MJ</span>
          <span class="col-vat">DPH %</span>
          <span class="col-total">Celkem</span>
          <span class="col-x"></span>
        </div>
        <div id="items-body"></div>
        <div class="items-foot">
          <button id="btn-add-item" class="btn btn-sm btn-ghost" type="button">+ Přidat položku</button>
        </div>
      </section>

      <!-- Vystavil / podpis -->
      <section class="card">
        <div class="card-head"><h2>Vystavil / podpis</h2></div>
        <div class="sig-grid">
          <label>Jméno <input id="sig-jmeno" placeholder="Jméno a příjmení" /></label>
          <label>E-mail <input id="sig-email" /></label>
          <label>Telefon <input id="sig-telefon" /></label>
        </div>
      </section>

      <!-- Poznámka + souhrn -->
      <section class="bottom">
        <div class="card note-card">
          <h2>Poznámka</h2>
          <textarea id="m-poznamka" rows="4" placeholder="Např. platební podmínky, poznámky k nabídce…"></textarea>
        </div>
        <div class="card summary-card">
          <div id="summary-rows"></div>
          <div class="summary-total">
            <span>Celkem k úhradě</span>
            <span id="grand-total">0,00 Kč</span>
          </div>
        </div>
      </section>
    </main>

    <footer class="foot muted">
      Rozpracovaná nabídka se ukládá ve vašem prohlížeči. Tlačítkem „Uložit" ji uložíte na server. · Orphans s.r.o.
    </footer>
  </div>

  <!-- Modal: uložené nabídky -->
  <div id="offers-modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <h2>Uložené nabídky</h2>
        <button id="offers-close" class="btn-x" type="button" title="Zavřít">×</button>
      </div>
      <div id="offers-list" class="offers-list"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <script src="js/logo.js"></script>
  <script src="js/font.js"></script>
  <script src="js/vendor/jspdf.umd.min.js"></script>
  <script src="js/vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
